<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <rect width="192" height="192" rx="40" fill="url(#shine)"/>
  <!-- O letter stylized -->
  <circle cx="96" cy="88" r="38" fill="none" stroke="#fff" stroke-width="8"/>
  <!-- Orbital ring -->
  <ellipse cx="96" cy="88" rx="52" ry="18" fill="none" stroke="#c4b5fd" stroke-width="3" transform="rotate(-25 96 88)"/>
  <!-- Dot on orbit -->
  <circle cx="140" cy="76" r="6" fill="#fbbf24"/>
  <!-- Text -->
  <text x="96" y="156" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="800" font-size="22">FLUX</text>
</svg>
